[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "negationscope"
version = "0.1.0"
description = "Reproducible negation datasets and paired evaluation for visual models"
requires-python = ">=3.10"
authors = [{name = "Viksit Garg"}]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8"]
dev = ["pytest>=8"]

[project.scripts]
negationscope = "negationscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
